<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR Models</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    model-viewer { width: 100%; height: 500px; }
    select { font-size: 16px; padding: 8px; margin: 10px 0; }
  </style>
</head>
<body>

  <select id="picker">
    <option value="subject1">Subject 1</option>
    <option value="subject2">Subject 2</option>
    <option value="subject3">Subject 3</option>
    <option value="subject4">Subject 4</option>
    <option value="subject5">Subject 5</option>
  </select>

  <model-viewer
    id="viewer"
    src="models/subject1.glb"
    alt="Subject 1"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    auto-rotate
    shadow-intensity="1">
  </model-viewer>

  <script>
    const viewer = document.getElementById('viewer');
    document.getElementById('picker').addEventListener('change', (e) => {
      const name = e.target.value;
      viewer.src = `models/${name}.glb`;
      viewer.alt = name;
    });
  </script>

</body>
</html>
